<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренувальний план</title>
<style>
  :root{
    --bg: #0a0c15;
    --panel: #141824;
    --panel2: #1a2030;
    --line: #2a3050;
    --ink: #ffffff;
    --muted: #b8c4e0;
    --accent: #e8a33d;
    --accent2: #4a90d9;
    --green: #3cb371;
    --red: #d9534f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: #ffffff;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
  }
  header{
    padding: 18px 16px 10px; text-align:center; position:sticky; top:0; z-index:10;
    background: linear-gradient(180deg, #0a0c15 80%, transparent);
  }
  header h1{
    margin:0; font-size: 1.8rem; letter-spacing:.5px;
    font-family: Georgia, 'Times New Roman', serif;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(0,255,136,0.2), 0 0 60px rgba(0,255,136,0.05);
    font-weight: 700;
  }
  header h1 .emoji-btn {
    cursor: pointer;
    display: inline-block;
    transition: all 0.2s;
    user-select: none;
  }
  header h1 .emoji-btn:hover {
    transform: scale(1.3);
    text-shadow: 0 0 30px rgba(0,255,136,0.6);
  }
  header h1 .emoji-btn:active {
    transform: scale(0.85);
  }

  .top-profile {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin: 0 12px 12px;
    flex-wrap: wrap;
  }
  .top-profile .gender-icon { font-size: 2rem; }
  .top-profile .upload-icon {
    font-size: 1.6rem;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 8px;
    border: 1px solid var(--green);
    background: rgba(60,179,113,0.1);
    transition: all 0.2s;
  }
  .top-profile .upload-icon:hover {
    background: var(--green);
    transform: scale(1.1);
  }
  .top-profile .profile-info {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .top-profile .profile-info .item {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .top-profile .profile-info .item .val {
    color: #ffffff;
    font-weight: 600;
  }
  .top-profile .edit-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 0.7rem;
    transition: all 0.2s;
  }
  .top-profile .edit-btn:hover {
    border-color: var(--accent2);
    color: #ffffff;
  }

  nav.days{
    display:flex; gap:8px; padding: 0 12px 12px; justify-content:center;
  }
  nav.days button{
    flex:1; max-width:160px; background:var(--panel2); border:1px solid var(--line);
    color:#d8ddf0; padding:12px 8px; border-radius:10px; font-size:.9rem; cursor:pointer;
    font-weight:600;
    transition: all 0.2s;
  }
  nav.days button:hover{
    background: var(--panel);
    border-color: var(--accent);
    color: #ffffff;
  }
  nav.days button.active{
    background: linear-gradient(135deg,#2a3a5c,#1d2130); border-color: var(--accent2);
    box-shadow: 0 0 0 2px var(--accent2) inset;
    color: #ffffff;
  }
  nav.days button.last-workout {
    border: 2px solid #00ff88 !important;
    box-shadow: 0 0 15px rgba(0, 255, 136, 0.2), inset 0 0 15px rgba(0, 255, 136, 0.05) !important;
    position: relative;
  }
  nav.days button.last-workout::after {
    content: '✅';
    position: absolute;
    top: -6px;
    right: -6px;
    font-size: 0.7rem;
    background: var(--bg);
    border-radius: 50%;
    padding: 2px;
  }

  main{ max-width: 720px; margin: 0 auto; padding: 0 12px 16px; }

  .group-label{
    margin: 28px 0 14px;
    padding: 8px 0;
    text-align: center;
  }
  .group-label .group-name {
    display: inline-block;
    padding: 6px 24px;
    border-radius: 12px;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #00ff88;
    text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88, 0 0 40px rgba(0,255,136,0.3), 0 0 80px rgba(0,255,136,0.1);
    background: rgba(0,255,136,0.06);
    border: 1px solid rgba(0,255,136,0.15);
  }

  .card{
    background: var(--panel); border:1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .card.done{ opacity:.5; }
  .card-top{ display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  
  .ex-header {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    width: 100%;
  }
  .ex-name-wrapper {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }
  .ex-gif-preview {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .ex-gif-preview img {
    width: 50px;
    height: 40px;
    border-radius: 6px;
    border: 1px solid var(--line);
    object-fit: cover;
    cursor: pointer;
    background: #1a2030;
  }
  .ex-gif-preview img:hover {
    transform: scale(2);
    z-index: 10;
    position: relative;
  }
  
  .ex-name{ 
    font-weight:700; 
    font-size:1.05rem; 
    color: #ffffff; 
    margin-bottom: 2px;
  }
  .ex-meta{ 
    color: #b8c4e0; 
    font-size:.85rem; 
    margin-top:2px;
    font-weight: 400;
  }
  .ai-tip {
    font-size: 0.7rem;
    color: var(--accent);
    margin-top: 3px;
    opacity: 0.8;
    font-weight: 400;
  }
  
  .ex-status {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-right: 6px;
  }
  .ex-status.done {
    background: var(--green);
    box-shadow: 0 0 12px rgba(60, 179, 113, 0.5);
  }
  .ex-status.partial {
    background: var(--accent);
    box-shadow: 0 0 12px rgba(232, 163, 61, 0.5);
  }
  .ex-status.empty {
    background: var(--line);
  }

  .day-progress {
    background: var(--panel2);
    border-radius: 10px;
    padding: 8px 14px;
    margin: 10px 0 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--line);
  }
  .day-progress .bar {
    flex: 1;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .day-progress .bar .fill {
    height: 100%;
    background: var(--green);
    border-radius: 3px;
    transition: width 0.3s;
    width: 0%;
  }
  .day-progress .text {
    font-size: 0.8rem;
    color: var(--muted);
    white-space: nowrap;
    font-weight: 500;
  }
  .day-progress .text b {
    color: var(--ink);
  }

  .actions{ margin-left:auto; display:flex; gap:8px; flex:0 0 auto; }
  .icon-btn{
    background:var(--panel2); border:1px solid var(--line); color:#d8ddf0;
    border-radius:8px; padding:8px 12px; font-size:.85rem; cursor:pointer; text-decoration:none;
    white-space:nowrap;
    transition: all 0.2s;
    font-weight: 500;
  }
  .icon-btn:hover{ 
    border-color:var(--accent2); 
    color: #ffffff;
    background: var(--panel);
    transform: scale(1.05);
  }

  .sets-row{ 
    display:grid; 
    grid-template-columns: repeat(6, 1fr);
    gap:6px; 
    margin-top:12px; 
  }
  .set-input{
    display:flex; flex-direction:column; gap:3px;
    position:relative;
  }
  .set-input .set-status {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin: 0 auto 2px;
    transition: all 0.3s;
  }
  .set-input .set-status.filled {
    background: var(--green);
    box-shadow: 0 0 8px rgba(60, 179, 113, 0.4);
  }
  .set-input .set-status.empty {
    background: var(--line);
  }
  .set-input label{ 
    font-size:.6rem; 
    color: #b8c4e0;
    font-weight: 600;
    text-align:center;
  }
  .set-input input{
    width:100%; background: #0d0f1a; border:1px solid var(--line); color: #ffffff;
    border-radius:6px; padding:6px 4px; font-size:.8rem; text-align:center;
    transition: all 0.2s;
    font-weight: 500;
  }
  .set-input input:focus{ 
    outline:none; 
    border-color:var(--accent2);
    box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.25);
    background: #131625;
  }
  .set-input input::placeholder{
    color: #6a7290;
    font-weight: 400;
    font-size: 0.6rem;
  }

  .last-log{
    margin-top:10px; font-size:.85rem; color: #d8ddf0;
    background: #0d0f1a; border-radius:8px; padding:8px 12px; border:1px solid var(--line);
  }
  .last-log b{ color: var(--green); font-weight: 700; }

  .alt-wrapper {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 6px;
  }
  .alt-wrapper .alt-row {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    width: 100%;
  }
  .alt-wrapper .alt-select {
    flex: 1;
    margin-top: 0;
    min-width: 120px;
  }
  .alt-wrapper .icon-btn {
    padding: 4px 8px;
    font-size: 0.8rem;
    flex-shrink: 0;
  }
  .clear-alt-btn {
    background: var(--panel2);
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
    font-size: 0.8rem;
    flex-shrink: 0;
    transition: all 0.2s;
    line-height: 1.4;
    font-weight: bold;
  }
  .clear-alt-btn:hover {
    background: var(--red);
    color: #ffffff;
    border-color: var(--red);
  }

  .alt-select{
    width:100%; background: #0d0f1a; border:1px solid var(--line);
    color: #b8c4e0; border-radius:6px;
    font-size:.85rem; padding:6px 10px;
    cursor:pointer; outline:none;
    -webkit-appearance:none; appearance:none;
    transition: all 0.2s;
  }
  .alt-select:focus{ 
    border-color:var(--accent); 
    color:#ffffff;
    box-shadow: 0 0 0 2px rgba(232,163,61,0.15);
  }
  .alt-select option{ 
    background:var(--panel); 
    color:#ffffff;
    padding: 4px;
  }
  .alt-select optgroup{
    background:var(--panel);
    color: var(--accent);
    font-weight: 700;
    font-size: .85rem;
    padding: 4px 0;
  }
  .alt-select optgroup option{
    padding-left: 12px;
    font-weight: 400;
    color: #d8ddf0;
  }

  .note-box{
    background: rgba(232,163,61,.1); border:1px solid rgba(232,163,61,.25);
    border-radius:10px; padding:12px 16px; font-size:.85rem; color: #e8d5a8; margin: 16px 0;
    line-height: 1.6;
  }

  .bottom-bar {
    max-width: 720px;
    margin: 0 auto;
    padding: 8px 12px 16px;
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    border-top: 1px solid var(--line);
    margin-top: 8px;
  }
  .bottom-btn {
    background: var(--panel2);
    border: 1px solid var(--line);
    color: #6a7290;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    font-family: inherit;
    line-height: 1.2;
    flex: 0 1 auto;
    min-width: 48px;
    justify-content: center;
  }
  .bottom-btn:hover {
    border-color: var(--accent2);
    color: #ffffff;
    background: var(--panel);
    transform: scale(1.05);
  }
  .bottom-btn:active {
    transform: scale(0.9);
  }
  .bottom-btn .label {
    font-size: 0.5rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.2px;
    text-transform: uppercase;
  }
  .bottom-btn:hover .label {
    color: #ffffff;
  }
  .bottom-btn.save-btn {
    border-color: rgba(232,163,61,0.3);
    color: var(--accent);
  }
  .bottom-btn.save-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .bottom-btn.resend-btn {
    border-color: rgba(74,144,217,0.3);
    color: var(--accent2);
  }
  .bottom-btn.resend-btn:hover {
    border-color: var(--accent2);
    color: var(--accent2);
  }
  .bottom-btn.debug-btn {
    border-color: rgba(232,163,61,0.2);
    color: #7ab8ff;
  }
  .bottom-btn.debug-btn:hover {
    border-color: #7ab8ff;
    color: #7ab8ff;
  }

  .toast{
    position: fixed; bottom: 80px; left:50%; transform:translateX(-50%);
    background: var(--green); color:#0a0c15; padding:12px 24px; border-radius:12px;
    font-size:1rem; font-weight:700; opacity:0; transition:opacity .3s; pointer-events:none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    z-index: 200;
  }
  .toast.show{ opacity:1; }

  .debug-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .debug-modal .content {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    max-width: 650px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .debug-modal .content h2 {
    color: var(--accent);
    margin-top: 0;
    font-size: 1.1rem;
    text-align: center;
  }
  .debug-modal .content .info-text {
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
    margin-bottom: 12px;
  }
  .debug-modal .content .key-item {
    background: var(--bg);
    border-radius: 6px;
    padding: 6px 10px;
    margin-bottom: 4px;
    font-size: 0.7rem;
    font-family: monospace;
    word-break: break-all;
    border-left: 2px solid var(--accent2);
  }
  .debug-modal .content .key-item .key {
    color: var(--accent2);
    font-weight: 600;
  }
  .debug-modal .content .key-item .value {
    color: var(--muted);
  }
  .debug-modal .content .btn-group {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .debug-modal .content .btn-group button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    min-width: 80px;
    max-width: 200px;
    transition: all 0.2s;
  }
  .debug-modal .content .btn-group button:hover {
    transform: scale(1.03);
  }
  .debug-modal .content .btn-group .close-debug {
    background: var(--accent2);
    color: #fff;
  }
  .debug-modal .content .btn-group .export-btn {
    background: var(--accent);
    color: #1a1208;
  }
  .debug-modal .content .btn-group .import-btn {
    background: var(--green);
    color: #fff;
  }
  .debug-modal .content .btn-group .clear-btn {
    background: var(--red);
    color: #fff;
  }
  .debug-modal .content .file-input-wrap {
    display: none;
  }

  .recovery-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .recovery-modal .content {
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 20px;
    padding: 24px 28px;
    max-width: 480px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .recovery-modal .content h2 {
    text-align: center;
    color: var(--accent);
    margin-top: 0;
    font-size: 1.4rem;
  }
  .recovery-modal .content .emoji-big {
    font-size: 3rem;
    text-align: center;
    display: block;
  }
  .recovery-modal .content ul {
    list-style: none;
    padding: 0;
    margin: 16px 0;
  }
  .recovery-modal .content ul li {
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95rem;
  }
  .recovery-modal .content ul li:last-child {
    border-bottom: none;
  }
  .recovery-modal .content .close-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #1a1208;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 12px;
    transition: all 0.2s;
  }
  .recovery-modal .content .close-btn:hover {
    transform: scale(1.02);
  }

  .icon-btn.save-ex{ color: var(--accent); border-color: rgba(232,163,61,.3); }
  .icon-btn.save-ex:hover{ 
    border-color: var(--accent);
    color: var(--accent);
  }
  .icon-btn.save-ex.saved{ color: var(--green); border-color: rgba(60,179,113,.3); }
  .icon-btn.cal-btn{ color: var(--accent2); }
  .icon-btn.cal-btn:hover{ color: #7ab8ff; }

  .modal-overlay{
    position: fixed; inset:0; background: rgba(0,0,0,.8); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    background: var(--panel); border:1px solid var(--line); border-radius: 16px 16px 0 0;
    width:100%; max-width: 720px; max-height: 78vh; overflow-y:auto; padding: 20px 20px 28px;
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-head h3{ 
    margin:0; 
    font-size:1.1rem; 
    color: #ffffff;
    font-weight: 700;
  }
  .modal-close{
    background:var(--panel2); border:1px solid var(--line); color:#d8ddf0;
    border-radius:8px; width:36px; height:36px; cursor:pointer; font-size:1.2rem;
    transition: all 0.2s;
    font-weight: bold;
  }
  .modal-close:hover{
    border-color: var(--red);
    color: #ffffff;
    background: rgba(217, 83, 79, 0.1);
  }
  .hist-row{
    display:flex; justify-content:space-between; gap:12px; padding:10px 14px;
    background: #0d0f1a; border-radius:8px; margin-bottom:8px; font-size:.9rem;
  }
  .hist-row .hd{ color: #b8c4e0; flex:0 0 auto; font-weight: 500; }
  .hist-row .hv{ color: #ffffff; text-align:right; font-weight: 600; }
  .hist-empty{ color:#b8c4e0; font-size:.9rem; text-align:center; padding: 24px 0; }

  .profile-bar{
    display:flex; gap:10px; justify-content:center; padding: 6px 12px 12px;
  }
  .profile-bar button{
    background:var(--panel2); border:1px solid var(--line); color:#b8c4e0;
    padding:10px 22px; border-radius:10px; font-size:.9rem; cursor:pointer; font-weight:600;
    transition: all 0.2s;
  }
  .profile-bar button:hover{
    border-color: var(--accent);
    color: #ffffff;
    background: var(--panel);
  }
  .profile-bar button.active{
    background: linear-gradient(135deg,#3a2a1a,#1d2130); border-color: var(--accent);
    color: #ffffff; box-shadow: 0 0 0 2px var(--accent) inset;
  }

  .age-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .age-modal .content {
    background: var(--panel);
    border: 1px solid var(--accent2);
    border-radius: 20px;
    padding: 28px 32px;
    max-width: 450px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .age-modal .content h2 {
    text-align: center;
    color: var(--accent2);
    margin-top: 0;
    font-size: 1.3rem;
  }
  .age-modal .content p {
    color: var(--muted);
    text-align: center;
    font-size: 0.9rem;
    margin-bottom: 16px;
  }
  .age-modal .content .form-group {
    margin-bottom: 12px;
  }
  .age-modal .content .form-group label {
    display: block;
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .age-modal .content .form-group input,
  .age-modal .content .form-group select {
    width: 100%;
    padding: 10px 12px;

// 5. ЗБЕРІГАННЯ
// ============================================================
function exId(dayId, name){ return dayId + '::' + name; }

function saveAllData() {
  try {
    localStorage.setItem('trenuvannya_man_pendingSets', JSON.stringify(pendingSets));
    localStorage.setItem('trenuvannya_man_savedThisSession', JSON.stringify(savedThisSession));
    localStorage.setItem('trenuvannya_man_currentDay', String(currentDay));
  } catch(e) {}
}

function loadAllData() {
  try {
    const pending = localStorage.getItem('trenuvannya_man_pendingSets');
    if (pending) pendingSets = JSON.parse(pending);
    else pendingSets = {};
    const saved = localStorage.getItem('trenuvannya_man_savedThisSession');
    if (saved) savedThisSession = JSON.parse(saved);
    else savedThisSession = {};
    const day = localStorage.getItem('trenuvannya_man_currentDay');
    if (day) currentDay = parseInt(day);
    else currentDay = 0;
  } catch(e) {
    pendingSets = {};
    savedThisSession = {};
    currentDay = 0;
  }
}

// ============================================================
// 6. ОСНОВНІ ФУНКЦІЇ
// ============================================================
function getLastWorkoutDay() {
  const days = getDays();
  if (!days || days.length === 0) return null;
  
  for (let i = days.length - 1; i >= 0; i--) {
    const day = days[i];
    if (!day || !day.groups) continue;
    let hasData = false;
    for (const g of day.groups) {
      for (const it of g.items) {
        const id = exId(day.id, it.name);
        const sets = pendingSets[id] || [];
        if (sets.some(s => s.raw && s.raw.trim() !== '')) {
          hasData = true;
          break;
        }
      }
      if (hasData) break;
    }
    if (hasData) return day.id;
  }
  
  for (let i = days.length - 1; i >= 0; i--) {
    const day = days[i];
    if (!day || !day.groups) continue;
    let hasData = false;
    for (const g of day.groups) {
      for (const it of g.items) {
        const id = exId(day.id, it.name);
        const log = lastLogs[id];
        if (log && log.sets && log.sets.length > 0) {
          hasData = true;
          break;
        }
      }
      if (hasData) break;
    }
    if (hasData) return day.id;
  }
  return null;
}

function checkExerciseStatus(id) {
  const sets = pendingSets[id] || [];
  const filledCount = sets.filter(s => s.raw && s.raw.trim() !== '').length;
  if (filledCount >= 6) return 'done';
  if (filledCount > 0) return 'partial';
  return 'empty';
}

function getDayProgress(day) {
  let total = 0, done = 0;
  for (const g of day.groups) {
    for (const it of g.items) {
      total++;
      const id = exId(day.id, it.name);
      const status = checkExerciseStatus(id);
      if (status === 'done' || status === 'partial') done++;
    }
  }
  return { total, done, percent: total > 0 ? Math.round((done / total) * 100) : 0 };
}

function setsFromPending(id) {
  return (pendingSets[id]||[]).map(s=>{
    if(!s.raw) return {w:'',r:''};
    const parts = s.raw.split('/');
    return {w: parts[0]?.trim()||'', r: parts[1]?.trim()||''};
  }).filter(s=>s.w || s.r);
}

function getLastWeight(id) {
  const log = lastLogs[id];
  if (!log || !log.sets || log.sets.length === 0) return null;
  for (const s of log.sets) {
    if (s.w && s.r) {
      return { weight: s.w, reps: s.r };
    }
  }
  return null;
}

async function sendToTelegram(text) {

async function sendWorkoutReport(force = false) {
  const days = getDays();
  const day = days && days.length > 0 ? days[currentDay] : null;
  if (!day || !day.groups) {
    showToast('⚠️ Завантажте план');
    return false;
  }
  
  // ===== ПЕРЕВІРКА: чи є дані =====
  let hasData = false;
  for (const g of day.groups) {
    for (const it of g.items) {
      const id = exId(day.id, it.name);
      const sets = pendingSets[id] || [];
      if (sets.some(s => s.raw && s.raw.trim() !== '')) {
        hasData = true;
        break;
      }
    }
    if (hasData) break;
  }
  
  if (!hasData) {
    showToast('⚠️ Немає даних для відправки');
    return false;
  }
  // =================================
  
  const today = new Date().toISOString().slice(0,10);
  const sentKey = 'man::' + day.id + '::' + today;
  
  // Перевірка чи вже відправлено
  const sent = localStorage.getItem('tg_sent_' + sentKey);
  if (!force && sent) {
    showToast('Звіт вже відправлено');
    return false;
  }
  
  let num = 1;
  const lines = [];
  for (const g of day.groups) {
    for (const it of g.items) {
      const id = exId(day.id, it.name);
      const sets = setsFromPending(id);
      if (sets.length) {
        const altText = (pendingSets[id+'::alt'] || {}).raw || '';
        const name = altText || it.name;
        const setsTxt = sets.map(s => s.w + '/' + s.r).join(' | ');
        lines.push(num + '. ' + name + '\n   ' + setsTxt);
        num++;
      }
    }
  }
  
  if (num > 1) {
    const ageText = userProfile.age ? '🎂 ' + userProfile.age + ' років' : '';
    const heightText = userProfile.height ? '📏 ' + userProfile.height + ' см' : '';
    const weightText = userProfile.weight ? '⚖️ ' + userProfile.weight + ' кг' : '';
    let msg = '👨 ' + ageText + ' ' + heightText + ' ' + weightText + ' — ' + day.label + '\n📅 ' + today + '\n';
    msg += '─'.repeat(30) + '\n';
    msg += lines.join('\n');
    
    const ok = await sendToTelegram(msg);
    if (ok) {
      localStorage.setItem('tg_sent_' + sentKey, '1');
      showToast(force ? '🔄 Звіт перевідправлено!' : '💪 Тренування збережено!');
      if (!force) renderMain();
      setTimeout(showRecoveryModal, 500);
      return true;
    } else {
      showToast('❌ Помилка відправки');
      return false;
    }
  } else {
    showToast('Немає даних');
    return false;
  }
}

function renderDayNav() {
  const nav = document.getElementById('dayNav');
  nav.innerHTML = '';
  const days = getDays();
  if (!days || days.length === 0) {
    nav.innerHTML = '<div style="color:var(--muted);text-align:center;padding:10px;">⚠️ Завантажте план</div>';
    return;
  }
  const lastDayId = getLastWorkoutDay();
  days.forEach((d, idx) => {
    const b = document.createElement('button');
    b.textContent = d.label.replace(/ — .*$/, '');
    if (idx === currentDay) b.classList.add('active');
    if (d.id === lastDayId && idx !== currentDay) b.classList.add('last-workout');
    b.onclick = () => { currentDay = idx; renderDayNav(); renderMain(); };
    nav.appendChild(b);
  });
}

function renderMain() {
  const days = getDays();
  const day = days && days.length > 0 ? days[currentDay] : null;
  const main = document.getElementById('main');
  main.innerHTML = '';
  
  if (!day || !day.groups || day.groups.length === 0) {
    main.innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted);">
      <div style="font-size:3rem;">📂</div>
      <h2>Завантажте план</h2>
      <p>Натисніть <b>📂</b> і виберіть Excel</p>
    </div>`;
    return;
  }
  
  // Прогрес
  const progress = getDayProgress(day);
  const pb = document.createElement('div');
  pb.className = 'day-progress';
  pb.innerHTML = `<span>📊 <b>${progress.done}</b>/${progress.total}</span>
    <div class="bar"><div class="fill" style="width:${progress.percent}%"></div></div>
    <span>${progress.percent}%</span>`;
  main.appendChild(pb);
  
  // Вправи
  day.groups.forEach(g => {
    const gl = document.createElement('div');
    gl.className = 'group-label';
    gl.innerHTML = `<span class="group-name">${g.label.toUpperCase()}</span>`;
    main.appendChild(gl);
    
    g.items.forEach(it => {
      const id = exId(day.id, it.name);
      const card = document.createElement('div');
      card.className = 'card';
      
      // Заголовок + GIF
      const top = document.createElement('div');
      top.className = 'card-top';
      
      const header = document.createElement('div');
      header.className = 'ex-header';
      
      const status = checkExerciseStatus(id);
      const dot = document.createElement('span');
      dot.className = 'ex-status ' + status;
      
      const nameWrap = document.createElement('div');
      nameWrap.className = 'ex-name-wrapper';
      nameWrap.appendChild(dot);
      
      const altText = (pendingSets[id+'::alt'] || {}).raw || '';
      const displayName = altText || it.name;
      
      const nameSpan = document.createElement('span');
      nameSpan.className = 'ex-name';
      nameSpan.textContent = displayName;
      nameWrap.appendChild(nameSpan);
      
      // GIF
      const gifWrap = document.createElement('div');
      gifWrap.className = 'ex-gif-preview';
      const gifImg = document.createElement('img');
      gifImg.src = getExerciseGif(displayName);
      gifImg.onclick = function() { window.open(this.src, '_blank'); };
      gifWrap.appendChild(gifImg);
      
      header.appendChild(nameWrap);
      header.appendChild(gifWrap);
      
      const info = document.createElement('div');
      info.style.flex = '1';
      info.appendChild(header);
      
      const meta = document.createElement('div');
      meta.className = 'ex-meta';
      meta.textContent = it.sets + '×' + it.reps;
      info.appendChild(meta);
      
      // Кнопки
      const actions = document.createElement('div');
      actions.className = 'actions';
      
      const calBtn = document.createElement('button');
      calBtn.className = 'icon-btn cal-btn';
      calBtn.textContent = '🗓';
      calBtn.onclick = () => openHistory(id, displayName);
      actions.appendChild(calBtn);
      
      const saveBtn = document.createElement('button');
      saveBtn.className = 'icon-btn save-ex' + (savedThisSession[id] ? ' saved' : '');
      saveBtn.textContent = savedThisSession[id] ? '✓' : '💾';
      saveBtn.onclick = () => saveExercise(id);
      actions.appendChild(saveBtn);
      
      top.appendChild(info);
      top.appendChild(actions);
      card.appendChild(top);
      
      // Поля вводу
      const setsRow = document.createElement('div');
      setsRow.className = 'sets-row';
      if (!pendingSets[id]) pendingSets[id] = Array.from({ length: 6 }, () => ({ w: '', r: '' }));
      for (let s = 0; s < 6; s++) {
        const wrap = document.createElement('div');
        wrap.className = 'set-input';
        const dotSet = document.createElement('div');
        dotSet.className = 'set-status ' + (pendingSets[id][s]?.raw ? 'filled' : 'empty');
        wrap.appendChild(dotSet);
        const label = document.createElement('label');
        label.textContent = s + 1;
        wrap.appendChild(label);
        const input = document.createElement('input');
        input.placeholder = 'вага/повт';
        input.value = pendingSets[id][s]?.raw || '';
        input.oninput = (e) => {
          pendingSets[id][s].raw = e.target.value;
          const d = wrap.querySelector('.set-status');
          if (d) d.className = 'set-status ' + (e.target.value.trim() ? 'filled' : 'empty');
        };
        wrap.appendChild(input);
        setsRow.appendChild(wrap);
      }
      card.appendChild(setsRow);
      
      // Заміна вправи
      const altWrap = document.createElement('div');
      altWrap.className = 'alt-wrapper';
      const altRow = document.createElement('div');
      altRow.className = 'alt-row';
      
      const altSel = document.createElement('select');
      altSel.className = 'alt-select';
      const def = document.createElement('option');
      def.value = '';
      def.textContent = '🔄 Заміна';
      def.disabled = true;
      def.selected = !(pendingSets[id+'::alt'] || {}).raw;
      altSel.appendChild(def);
      
      for (const [group, exercises] of Object.entries(ALL_EXERCISES)) {
        const optgroup = document.createElement('optgroup');
        optgroup.label = group;
        exercises.forEach(ex => {
          const opt = document.createElement('option');
          opt.value = ex;
          opt.textContent = ex;
          if ((pendingSets[id+'::alt'] || {}).raw === ex) opt.selected = true;
          optgroup.appendChild(opt);
        });
        altSel.appendChild(optgroup);
      }
      
      const custom = document.createElement('option');
      custom.value = '__custom__';
      custom.textContent = '✏️ Своя...';
      altSel.appendChild(custom);
      
      altSel.onchange = function() {
        if (this.value === '__custom__') {
          const c = prompt('Назва вправи:');
          if (c && c.trim()) {
            if (!pendingSets[id+'::alt']) pendingSets[id+'::alt'] = {};
            pendingSets[id+'::alt'].raw = c.trim();
            const opt = document.createElement('option');
            opt.value = c.trim();
            opt.textContent = c.trim();
            opt.selected = true;
            altSel.insertBefore(opt, custom);
          } else {
            altSel.value = (pendingSets[id+'::alt'] || {}).raw || '';
          }
        } else {
          if (!pendingSets[id+'::alt']) pendingSets[id+'::alt'] = {};
          pendingSets[id+'::alt'].raw = this.value;
        }
        // Оновлюємо назву та GIF
        const newName = (pendingSets[id+'::alt'] || {}).raw || '';
        const nameSpan = card.querySelector('.ex-name');
        if (nameSpan) nameSpan.textContent = newName || it.name;
        const gif = card.querySelector('.ex-gif-preview img');
        if (gif) gif.src = getExerciseGif(newName || it.name);
      };
      
      altRow.appendChild(altSel);
      
      const clear = document.createElement('button');
      clear.className = 'clear-alt-btn';
      clear.textContent = '✕';
      clear.onclick = () => {
        if (pendingSets[id+'::alt']) {
          delete pendingSets[id+'::alt'];
          const nameSpan = card.querySelector('.ex-name');
          if (nameSpan) nameSpan.textContent = it.name;
          const gif = card.querySelector('.ex-gif-preview img');
          if (gif) gif.src = getExerciseGif(it.name);
          showToast('✅ Заміну видалено');
        }
      };
      altRow.appendChild(clear);
      altWrap.appendChild(altRow);
      card.appendChild(altWrap);
      
      // Минулий результат
      const lastLog = lastLogs[id];
      if (lastLog) {
        const ll = document.createElement('div');
        ll.className = 'last-log';
        const sets = lastLog.sets.filter(s => s.w && s.r).map(s => s.w + '/' + s.r).join(', ');
        ll.innerHTML = '📅 Минулий результат (' + lastLog.date + '): <b>' + sets + '</b>';
        card.appendChild(ll);
      }
      
      main.appendChild(card);
    });
  });
}

function renderAll() {
  renderDayNav();
  renderMain();
}

// ============================================================
// 9. ДОДАТКОВІ ФУНКЦІЇ
// ============================================================
async function saveExercise(id) {
  const sets = setsFromPending(id);
  if (!sets.length) { showToast('Заповніть хоча б один сет'); return; }
  const today = new Date().toISOString().slice(0,10);
  try {
    lastLogs[id] = { date: today, sets };
    localStorage.setItem('lastlog:' + id, JSON.stringify({ date: today, sets }));
    savedThisSession[id] = true;
    showToast('✅ Збережено');
    renderMain();
    saveAllData();
  } catch(e) { showToast('❌ Помилка'); }
}

async function openHistory(id, name) {
  const hist = [];
  const h = localStorage.getItem('history:' + id);
  if (h) { try { hist.push(...JSON.parse(h)); } catch(e) {} }
  
  const root = document.getElementById('modalRoot');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
  
  const sheet = document.createElement('div');
  sheet.className = 'modal-sheet';
  sheet.innerHTML = `
    <div class="modal-head">
      <h3>🗓 Історія — ${name}</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    ${hist.length === 0 ? '<div class="hist-empty">Записів немає</div>' :
      [...hist].reverse().map(log => 
        `<div class="hist-row">
          <span class="hd">📅 ${log.date}</span>
          <span class="hv">${(log.sets||[]).map(s => s.w + '/' + s.r).join(', ')}</span>
        </div>`
      ).join('')}
  `;
  overlay.appendChild(sheet);
  root.appendChild(overlay);
}

function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2500);
}

// 10. ВІДНОВЛЕННЯ (РАНДОМНІ ПІДКАЗКИ)
// ============================================================

// ============================================================
// 11. ЗАВАНТАЖЕННЯ EXCEL
// ============================================================
function importXlsx(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const ws = wb.Sheets['Чоловік'];
      if (!ws) { showToast('❌ Аркуш "Чоловік" не знайдено'); return; }
      
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      let headerRow = -1;
      for (let i = 0; i < rows.length; i++) {
        if (String(rows[i][0] || '').toLowerCase().includes('день')) { headerRow = i; break; }
      }
      if (headerRow === -1) { showToast('❌ Не знайдено заголовки'); return; }
      
      const groups = { 1: {}, 2: {}, 3: {} };
      for (let r = headerRow + 1; r < rows.length; r++) {
        const row = rows[r];
        if (!row || row.length === 0) continue;
        const day = parseInt(row[0]);
        if (![1,2,3].includes(day)) continue;
        const group = String(row[1] || '').trim();
        const name = String(row[2] || '').trim();
        const sets = parseInt(row[3]) || 3;
        const reps = String(row[4] || '10-12').trim();
        if (!name) continue;
        if (!groups[day][group]) groups[day][group] = [];
        groups[day][group].push({ name, sets, reps });
      }
      
      const result = [1,2,3].map(d => ({
        id: 'd' + d,
        label: 'День ' + d,
        groups: Object.entries(groups[d] || {}).map(([label, items]) => ({ label, items }))
      }));
      
      if (!result.some(d => d.groups.length > 0)) { showToast('❌ Немає даних'); return; }
      
      localStorage.setItem('custom-plan-man', JSON.stringify(result));
      DAYS_MAN = result;
      currentDay = 0;
      pendingSets = {};
      savedThisSession = {};
      lastLogs = {};
      
      // Завантажуємо lastLogs
      for (const day of DAYS_MAN) {
        for (const g of day.groups) {
          for (const it of g.items) {
            const id = exId(day.id, it.name);
            const raw = localStorage.getItem('lastlog:' + id);
            if (raw) {
              try { lastLogs[id] = JSON.parse(raw); } catch(e) {}
            }
          }
        }
      }
      
      renderAll();
      showToast('✅ План завантажено!');
    } catch(err) {
      showToast('❌ Помилка: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

// 12. ІНІЦІАЛІЗАЦІЯ
// ============================================================
document.getElementById('saveBtn').onclick = () => sendWorkoutReport(false);
document.getElementById('resendBtn').onclick = () => sendWorkoutReport(true);

document.getElementById('xlsxInput').addEventListener('change', function(e) {

  this.value = '';
});

function showDebugData() {
  const modal = document.createElement('div');
  modal.className = 'debug-modal';
  let html = '<div class="content"><h2>🔍 Дані</h2>';
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && (key.startsWith('trenuvannya_man_') || key.startsWith('lastlog:') || key.startsWith('history:') ||
         key === 'user_age' || key === 'user_height' || key === 'user_weight' || key === 'user_health' ||
         key === 'custom-plan-man')) {
      const val = localStorage.getItem(key);
      html += `<div class="key-item"><span class="key">${key}</span><br><span class="value">${val.length > 200 ? val.substring(0,200)+'...' : val}</span></div>`;
    }
  }
  html += `<div class="btn-group"><button class="close-debug" onclick="this.closest('.debug-modal').remove()">❌ Закрити</button></div></div>`;
  modal.innerHTML = html;
  document.body.appendChild(modal);
}

function clearCacheAndReload() {
  if (confirm('🔄 Очистити кеш і перезавантажити?')) {
    const v = new Date().toISOString().slice(0,10) + '-' + Math.random().toString(36).substr(2,6);
    localStorage.setItem('app_version', v);
    location.reload();
  }
}

// ============================================================
// 13. СТАРТ
// ============================================================
(async function init() {
  // Завантажуємо профіль
  const a = localStorage.getItem('user_age');
  const h = localStorage.getItem('user_height');
  const w = localStorage.getItem('user_weight');
  const he = localStorage.getItem('user_health');
  if (a) userProfile.age = parseInt(a);
  if (h) userProfile.height = parseInt(h);
  if (w) userProfile.weight = parseInt(w);
  if (he) userProfile.health = he;
  
  // Завантажуємо план
  try {
    const plan = localStorage.getItem('custom-plan-man');
    if (plan) { const p = JSON.parse(plan); if (p && p.length > 0) DAYS_MAN = p; }
  } catch(e) {}
  
  // Завантажуємо дані
  loadAllData();
  
  // Завантажуємо lastLogs
  for (const day of DAYS_MAN) {
    for (const g of day.groups) {
      for (const it of g.items) {
        const id = exId(day.id, it.name);
        const raw = localStorage.getItem('lastlog:' + id);
        if (raw) {
          try { lastLogs[id] = JSON.parse(raw); } catch(e) {}
        }
      }
    }
  }
  
  updateTopProfile();
  renderAll();
  
  if (!userProfile.age) {
    setTimeout(showProfileModal, 800);
  }
})();
