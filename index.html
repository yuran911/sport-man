<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренувальний план</title>
<style>
  :root{
    --bg: #0a0c15;
    --panel: #141824;
    --panel2: #1a2030;
    --line: #2a3050;
    --ink: #ffffff;
    --muted: #b8c4e0;
    --accent: #e8a33d;
    --accent2: #4a90d9;
    --green: #3cb371;
    --red: #d9534f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: #ffffff;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
  }
  header{
    padding: 18px 16px 10px; text-align:center; position:sticky; top:0; z-index:10;
    background: linear-gradient(180deg, #0a0c15 80%, transparent);
  }
  header h1{
    margin:0; font-size: 1.8rem; letter-spacing:.5px;
    font-family: Georgia, 'Times New Roman', serif;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(0,255,136,0.2), 0 0 60px rgba(0,255,136,0.05);
    font-weight: 700;
  }
  header h1 .emoji-btn {
    cursor: pointer;
    display: inline-block;
    transition: all 0.2s;
    user-select: none;
  }
  header h1 .emoji-btn:hover {
    transform: scale(1.3);
    text-shadow: 0 0 30px rgba(0,255,136,0.6);
  }
  header h1 .emoji-btn:active {
    transform: scale(0.85);
  }

  .top-profile {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin: 0 12px 12px;
    flex-wrap: wrap;
  }
  .top-profile .gender-icon { font-size: 2rem; }
  .top-profile .upload-icon {
    font-size: 1.6rem;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 8px;
    border: 1px solid var(--green);
    background: rgba(60,179,113,0.1);
    transition: all 0.2s;
  }
  .top-profile .upload-icon:hover {
    background: var(--green);
    transform: scale(1.1);
  }
  .top-profile .profile-info {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .top-profile .profile-info .item {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .top-profile .profile-info .item .val {
    color: #ffffff;
    font-weight: 600;
  }
  .top-profile .edit-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 0.7rem;
    transition: all 0.2s;
  }
  .top-profile .edit-btn:hover {
    border-color: var(--accent2);
    color: #ffffff;
  }

  nav.days{
    display:flex; gap:8px; padding: 0 12px 12px; justify-content:center;
  }
  nav.days button{
    flex:1; max-width:160px; background:var(--panel2); border:1px solid var(--line);
    color:#d8ddf0; padding:12px 8px; border-radius:10px; font-size:.9rem; cursor:pointer;
    font-weight:600;
    transition: all 0.2s;
  }
  nav.days button:hover{
    background: var(--panel);
    border-color: var(--accent);
    color: #ffffff;
  }
  nav.days button.active{
    background: linear-gradient(135deg,#2a3a5c,#1d2130); border-color: var(--accent2);
    box-shadow: 0 0 0 2px var(--accent2) inset;
    color: #ffffff;
  }
  nav.days button.last-workout {
    border: 2px solid #00ff88 !important;
    box-shadow: 0 0 15px rgba(0, 255, 136, 0.2), inset 0 0 15px rgba(0, 255, 136, 0.05) !important;
    position: relative;
  }
  nav.days button.last-workout::after {
    content: '✅';
    position: absolute;
    top: -6px;
    right: -6px;
    font-size: 0.7rem;
    background: var(--bg);
    border-radius: 50%;
    padding: 2px;
  }

  main{ max-width: 720px; margin: 0 auto; padding: 0 12px 16px; }

  .group-label{
    margin: 28px 0 14px;
    padding: 8px 0;
    text-align: center;
  }
  .group-label .group-name {
    display: inline-block;
    padding: 6px 24px;
    border-radius: 12px;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #00ff88;
    text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88, 0 0 40px rgba(0,255,136,0.3), 0 0 80px rgba(0,255,136,0.1);
    background: rgba(0,255,136,0.06);
    border: 1px solid rgba(0,255,136,0.15);
  }

  .card{
    background: var(--panel); border:1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .card.done{ opacity:.5; }
  .card-top{ display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  
  .ex-header {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    width: 100%;
  }
  .ex-name-wrapper {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }
  .ex-gif-preview {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .ex-gif-preview img {
    width: 50px;
    height: 40px;
    border-radius: 6px;
    border: 1px solid var(--line);
    object-fit: cover;
    cursor: pointer;
    background: #1a2030;
  }
  .ex-gif-preview img:hover {
    transform: scale(2);
    z-index: 10;
    position: relative;
  }
  
  .ex-name{ 
    font-weight:700; 
    font-size:1.05rem; 
    color: #ffffff; 
    margin-bottom: 2px;
  }
  .ex-meta{ 
    color: #b8c4e0; 
    font-size:.85rem; 
    margin-top:2px;
    font-weight: 400;
  }
  .ai-tip {
    font-size: 0.7rem;
    color: var(--accent);
    margin-top: 3px;
    opacity: 0.8;
    font-weight: 400;
  }
  
  .ex-status {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-right: 6px;
  }
  .ex-status.done {
    background: var(--green);
    box-shadow: 0 0 12px rgba(60, 179, 113, 0.5);
  }
  .ex-status.partial {
    background: var(--accent);
    box-shadow: 0 0 12px rgba(232, 163, 61, 0.5);
  }
  .ex-status.empty {
    background: var(--line);
  }

  .day-progress {
    background: var(--panel2);
    border-radius: 10px;
    padding: 8px 14px;
    margin: 10px 0 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--line);
  }
  .day-progress .bar {
    flex: 1;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .day-progress .bar .fill {
    height: 100%;
    background: var(--green);
    border-radius: 3px;
    transition: width 0.3s;
    width: 0%;
  }
  .day-progress .text {
    font-size: 0.8rem;
    color: var(--muted);
    white-space: nowrap;
    font-weight: 500;
  }
  .day-progress .text b {
    color: var(--ink);
  }

  .actions{ margin-left:auto; display:flex; gap:8px; flex:0 0 auto; }
  .icon-btn{
    background:var(--panel2); border:1px solid var(--line); color:#d8ddf0;
    border-radius:8px; padding:8px 12px; font-size:.85rem; cursor:pointer; text-decoration:none;
    white-space:nowrap;
    transition: all 0.2s;
    font-weight: 500;
  }
  .icon-btn:hover{ 
    border-color:var(--accent2); 
    color: #ffffff;
    background: var(--panel);
    transform: scale(1.05);
  }

  .sets-row{ 
    display:grid; 
    grid-template-columns: repeat(6, 1fr);
    gap:6px; 
    margin-top:12px; 
  }
  .set-input{
    display:flex; flex-direction:column; gap:3px;
    position:relative;
  }
  .set-input .set-status {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin: 0 auto 2px;
    transition: all 0.3s;
  }
  .set-input .set-status.filled {
    background: var(--green);
    box-shadow: 0 0 8px rgba(60, 179, 113, 0.4);
  }
  .set-input .set-status.empty {
    background: var(--line);
  }
  .set-input label{ 
    font-size:.6rem; 
    color: #b8c4e0;
    font-weight: 600;
    text-align:center;
  }
  .set-input input{
    width:100%; background: #0d0f1a; border:1px solid var(--line); color: #ffffff;
    border-radius:6px; padding:6px 4px; font-size:.8rem; text-align:center;
    transition: all 0.2s;
    font-weight: 500;
  }
  .set-input input:focus{ 
    outline:none; 
    border-color:var(--accent2);
    box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.25);
    background: #131625;
  }
  .set-input input::placeholder{
    color: #6a7290;
    font-weight: 400;
    font-size: 0.6rem;
  }

  .last-log{
    margin-top:10px; font-size:.85rem; color: #d8ddf0;
    background: #0d0f1a; border-radius:8px; padding:8px 12px; border:1px solid var(--line);
  }
  .last-log b{ color: var(--green); font-weight: 700; }

  .alt-wrapper {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 6px;
  }
  .alt-wrapper .alt-row {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    width: 100%;
  }
  .alt-wrapper .alt-select {
    flex: 1;
    margin-top: 0;
    min-width: 120px;
  }
  .alt-wrapper .icon-btn {
    padding: 4px 8px;
    font-size: 0.8rem;
    flex-shrink: 0;
  }
  .clear-alt-btn {
    background: var(--panel2);
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
    font-size: 0.8rem;
    flex-shrink: 0;
    transition: all 0.2s;
    line-height: 1.4;
    font-weight: bold;
  }
  .clear-alt-btn:hover {
    background: var(--red);
    color: #ffffff;
    border-color: var(--red);
  }

  .alt-gif-preview {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 8px;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    border: 1px solid var(--line);
    margin-top: 4px;
  }
  .alt-gif-preview img {
    max-width: 80px;
    max-height: 60px;
    border-radius: 6px;
    border: 1px solid var(--line);
    object-fit: cover;
    background: #1a2030;
  }
  .alt-gif-preview .gif-label {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .alt-select{
    width:100%; background: #0d0f1a; border:1px solid var(--line);
    color: #b8c4e0; border-radius:6px;
    font-size:.85rem; padding:6px 10px;
    cursor:pointer; outline:none;
    -webkit-appearance:none; appearance:none;
    transition: all 0.2s;
  }
  .alt-select:focus{ 
    border-color:var(--accent); 
    color:#ffffff;
    box-shadow: 0 0 0 2px rgba(232,163,61,0.15);
  }
  .alt-select option{ 
    background:var(--panel); 
    color:#ffffff;
    padding: 4px;
  }
  .alt-select optgroup{
    background:var(--panel);
    color: var(--accent);
    font-weight: 700;
    font-size: .85rem;
    padding: 4px 0;
  }
  .alt-select optgroup option{
    padding-left: 12px;
    font-weight: 400;
    color: #d8ddf0;
  }

  .note-box{
    background: rgba(232,163,61,.1); border:1px solid rgba(232,163,61,.25);
    border-radius:10px; padding:12px 16px; font-size:.85rem; color: #e8d5a8; margin: 16px 0;
    line-height: 1.6;
  }

  .bottom-bar {
    max-width: 720px;
    margin: 0 auto;
    padding: 8px 12px 16px;
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    border-top: 1px solid var(--line);
    margin-top: 8px;
  }
  .bottom-btn {
    background: var(--panel2);
    border: 1px solid var(--line);
    color: #6a7290;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    font-family: inherit;
    line-height: 1.2;
    flex: 0 1 auto;
    min-width: 48px;
    justify-content: center;
  }
  .bottom-btn:hover {
    border-color: var(--accent2);
    color: #ffffff;
    background: var(--panel);
    transform: scale(1.05);
  }
  .bottom-btn:active {
    transform: scale(0.9);
  }
  .bottom-btn .label {
    font-size: 0.5rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.2px;
    text-transform: uppercase;
  }
  .bottom-btn:hover .label {
    color: #ffffff;
  }
  .bottom-btn.save-btn {
    border-color: rgba(232,163,61,0.3);
    color: var(--accent);
  }
  .bottom-btn.save-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .bottom-btn.resend-btn {
    border-color: rgba(74,144,217,0.3);
    color: var(--accent2);
  }
  .bottom-btn.resend-btn:hover {
    border-color: var(--accent2);
    color: var(--accent2);
  }
  .bottom-btn.debug-btn {
    border-color: rgba(232,163,61,0.2);
    color: #7ab8ff;
  }
  .bottom-btn.debug-btn:hover {
    border-color: #7ab8ff;
    color: #7ab8ff;
  }

  .toast{
    position: fixed; bottom: 80px; left:50%; transform:translateX(-50%);
    background: var(--green); color:#0a0c15; padding:12px 24px; border-radius:12px;
    font-size:1rem; font-weight:700; opacity:0; transition:opacity .3s; pointer-events:none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    z-index: 200;
  }
  .toast.show{ opacity:1; }

  .debug-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .debug-modal .content {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    max-width: 650px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .debug-modal .content h2 {
    color: var(--accent);
    margin-top: 0;
    font-size: 1.1rem;
    text-align: center;
  }
  .debug-modal .content .info-text {
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
    margin-bottom: 12px;
  }
  .debug-modal .content .key-item {
    background: var(--bg);
    border-radius: 6px;
    padding: 6px 10px;
    margin-bottom: 4px;
    font-size: 0.7rem;
    font-family: monospace;
    word-break: break-all;
    border-left: 2px solid var(--accent2);
  }
  .debug-modal .content .key-item .key {
    color: var(--accent2);
    font-weight: 600;
  }
  .debug-modal .content .key-item .value {
    color: var(--muted);
  }
  .debug-modal .content .btn-group {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .debug-modal .content .btn-group button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    min-width: 80px;
    max-width: 200px;
    transition: all 0.2s;
  }
  .debug-modal .content .btn-group button:hover {
    transform: scale(1.03);
  }
  .debug-modal .content .btn-group .close-debug {
    background: var(--accent2);
    color: #fff;
  }
  .debug-modal .content .btn-group .export-btn {
    background: var(--accent);
    color: #1a1208;
  }
  .debug-modal .content .btn-group .import-btn {
    background: var(--green);
    color: #fff;
  }
  .debug-modal .content .btn-group .clear-btn {
    background: var(--red);
    color: #fff;
  }
  .debug-modal .content .file-input-wrap {
    display: none;
  }

  .recovery-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .recovery-modal .content {
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 20px;
    padding: 24px 28px;
    max-width: 480px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .recovery-modal .content h2 {
    text-align: center;
    color: var(--accent);
    margin-top: 0;
    font-size: 1.4rem;
  }
  .recovery-modal .content .emoji-big {
    font-size: 3rem;
    text-align: center;
    display: block;
  }
  .recovery-modal .content ul {
    list-style: none;
    padding: 0;
    margin: 16px 0;
  }
  .recovery-modal .content ul li {
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95rem;
  }
  .recovery-modal .content ul li:last-child {
    border-bottom: none;
  }
  .recovery-modal .content .close-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #1a1208;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 12px;
    transition: all 0.2s;
  }
  .recovery-modal .content .close-btn:hover {
    transform: scale(1.02);
  }

  .icon-btn.save-ex{ color: var(--accent); border-color: rgba(232,163,61,.3); }
  .icon-btn.save-ex:hover{ 
    border-color: var(--accent);
    color: var(--accent);
  }
  .icon-btn.save-ex.saved{ color: var(--green); border-color: rgba(60,179,113,.3); }
  .icon-btn.cal-btn{ color: var(--accent2); }
  .icon-btn.cal-btn:hover{ color: #7ab8ff; }

  .modal-overlay{
    position: fixed; inset:0; background: rgba(0,0,0,.8); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    background: var(--panel); border:1px solid var(--line); border-radius: 16px 16px 0 0;
    width:100%; max-width: 720px; max-height: 78vh; overflow-y:auto; padding: 20px 20px 28px;
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-head h3{ 
    margin:0; 
    font-size:1.1rem; 
    color: #ffffff;
    font-weight: 700;
  }
  .modal-close{
    background:var(--panel2); border:1px solid var(--line); color:#d8ddf0;
    border-radius:8px; width:36px; height:36px; cursor:pointer; font-size:1.2rem;
    transition: all 0.2s;
    font-weight: bold;
  }
  .modal-close:hover{
    border-color: var(--red);
    color: #ffffff;
    background: rgba(217, 83, 79, 0.1);
  }
  .hist-row{
    display:flex; justify-content:space-between; gap:12px; padding:10px 14px;
    background: #0d0f1a; border-radius:8px; margin-bottom:8px; font-size:.9rem;
  }
  .hist-row .hd{ color: #b8c4e0; flex:0 0 auto; font-weight: 500; }
  .hist-row .hv{ color: #ffffff; text-align:right; font-weight: 600; }
  .hist-empty{ color:#b8c4e0; font-size:.9rem; text-align:center; padding: 24px 0; }

  .profile-bar{
    display:flex; gap:10px; justify-content:center; padding: 6px 12px 12px;
  }
  .profile-bar button{
    background:var(--panel2); border:1px solid var(--line); color:#b8c4e0;
    padding:10px 22px; border-radius:10px; font-size:.9rem; cursor:pointer; font-weight:600;
    transition: all 0.2s;
  }
  .profile-bar button:hover{
    border-color: var(--accent);
    color: #ffffff;
    background: var(--panel);
  }
  .profile-bar button.active{
    background: linear-gradient(135deg,#3a2a1a,#1d2130); border-color: var(--accent);
    color: #ffffff; box-shadow: 0 0 0 2px var(--accent) inset;
  }

  .age-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .age-modal .content {
    background: var(--panel);
    border: 1px solid var(--accent2);
    border-radius: 20px;
    padding: 28px 32px;
    max-width: 450px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .age-modal .content h2 {
    text-align: center;
    color: var(--accent2);
    margin-top: 0;

function getStorageKey(key) {
  return 'trenuvannya_man_' + key;
}

function saveAllData() {
  try {
    localStorage.setItem(getStorageKey('pendingSets'), JSON.stringify(pendingSets));
    localStorage.setItem(getStorageKey('checkedState'), JSON.stringify(checkedState));
    localStorage.setItem(getStorageKey('savedThisSession'), JSON.stringify(savedThisSession));
    localStorage.setItem(getStorageKey('currentDay'), String(currentDay));
  } catch(e) { console.error('Save error:', e); }
}

function loadAllData() {
  try {
    const pending = localStorage.getItem(getStorageKey('pendingSets'));
    if (pending) pendingSets = JSON.parse(pending);
    else pendingSets = {};
    const checked = localStorage.getItem(getStorageKey('checkedState'));
    if (checked) checkedState = JSON.parse(checked);
    else checkedState = {};
    const saved = localStorage.getItem(getStorageKey('savedThisSession'));
    if (saved) savedThisSession = JSON.parse(saved);
    else savedThisSession = {};
    const day = localStorage.getItem(getStorageKey('currentDay'));
    if (day) currentDay = parseInt(day);
    else currentDay = 0;
  } catch(e) {
    pendingSets = {};
    checkedState = {};
    savedThisSession = {};
    currentDay = 0;
  }
}

function exId(dayId, name){ return dayId + '::' + name; }

// ============================================================
// 7. ОСНОВНІ ФУНКЦІЇ
// ============================================================
function renderProfileBar(){
  const pb = document.getElementById('profileBar');
  if (pb) {
    pb.innerHTML = '';
    const b = document.createElement('button');
    b.textContent = '👨';
    b.classList.add('active');
    b.style.fontSize = '1.8rem';
    pb.appendChild(b);
  }
}

function renderDayNav(){
  const nav = document.getElementById('dayNav');
  nav.innerHTML = '';
  const days = getDays();
  if (!days || days.length === 0) {
    nav.innerHTML = '<div style="color:var(--muted);text-align:center;padding:10px;">⚠️ Завантажте план з Excel</div>';
    return;
  }
  const lastDayId = getLastWorkoutDay();
  days.forEach((d, idx)=>{
    const b = document.createElement('button');
    b.textContent = d.label.replace(/ — .*$/, '');
    if(idx===currentDay) b.classList.add('active');
    if (d.id === lastDayId && idx !== currentDay) {
      b.classList.add('last-workout');
    }
    b.onclick = ()=>{ currentDay = idx; renderDayNav(); renderMain(); };
    nav.appendChild(b);
  });
}

function getLastWorkoutDay() {
  const days = getDays();
  if (!days || days.length === 0) return null;
  
  for (let i = days.length - 1; i >= 0; i--) {
    const day = days[i];
    if (!day || !day.groups) continue;
    let hasData = false;
    for (const g of day.groups) {
      for (const it of g.items) {
        const id = exId(day.id, it.name);
        const sets = pendingSets[id] || [];
        if (sets.some(s => s.raw && s.raw.trim() !== '')) {
          hasData = true;
          break;
        }
      }
      if (hasData) break;
    }
    if (hasData) return day.id;
  }
  
  for (let i = days.length - 1; i >= 0; i--) {
    const day = days[i];
    if (!day || !day.groups) continue;
    let hasData = false;
    for (const g of day.groups) {
      for (const it of g.items) {
        const id = exId(day.id, it.name);
        const log = lastLogs[id];
        if (log && log.sets && log.sets.length > 0) {
          hasData = true;
          break;
        }
      }
      if (hasData) break;
    }
    if (hasData) return day.id;
  }
  return null;
}

function getLastWeight(id) {
  const log = lastLogs[id];
  if (!log || !log.sets || log.sets.length === 0) return null;
  for (const s of log.sets) {
    if (s.w && s.r) {
      return { weight: s.w, reps: s.r };
    }
  }
  return null;
}

function checkExerciseStatus(id) {
  const sets = pendingSets[id] || [];
  const filledCount = sets.filter(s => s.raw && s.raw.trim() !== '').length;
  const totalSets = sets.length || 6;
  if (filledCount >= totalSets) return 'done';
  if (filledCount > 0) return 'partial';
  return 'empty';
}

function getDayProgress(day) {
  let total = 0, done = 0;
  for (const g of day.groups) {
    for (const it of g.items) {
      total++;
      const id = exId(day.id, it.name);
      const status = checkExerciseStatus(id);
      if (status === 'done' || status === 'partial') done++;
    }
  }
  return { total, done, percent: total > 0 ? Math.round((done / total) * 100) : 0 };
}

function getHistoryForExercise(id) {
  const hist = [];
  const h = localStorage.getItem('history:' + id);
  if (h) {
    try {
      const parsed = JSON.parse(h);
      if (Array.isArray(parsed)) {
        for (const entry of parsed) {
          if (entry.sets && entry.sets.length > 0) {
            const hasData = entry.sets.some(s => s.w && s.r);
            if (hasData) hist.push(entry);
          }
        }
      }
    } catch(e) {}
  }
  return hist;
}

function setsFromPending(id) {
  return (pendingSets[id]||[]).map(s=>{
    if(!s.raw) return {w:'',r:''};
    const parts = s.raw.split('/');
    return {w: parts[0]?.trim()||'', r: parts[1]?.trim()||''};
  }).filter(s=>s.w || s.r);
}

const TELEGRAM_TOKEN = '8910047408:AAH-l-AMBmlQmTPuWpBAhDXS59RNyaZ8xPM';
const CHAT_ID_MAIN = '471234977';
const TG_QUEUE_KEY = 'tg-queue-v2';
const TG_SENT_KEY = 'tg-sent-dates';

function getTgQueue(){
  try{ return JSON.parse(localStorage.getItem(TG_QUEUE_KEY) || '[]'); }catch(e){ return []; }
}
function setTgQueue(q){
  try{ localStorage.setItem(TG_QUEUE_KEY, JSON.stringify(q)); }catch(e){}
}
function getSentDates(){
  try{ return JSON.parse(localStorage.getItem(TG_SENT_KEY) || '{}'); }catch(e){ return {}; }
}
function markSent(sentKey){
  const s = getSentDates();
  s[sentKey] = Date.now();
  try{ localStorage.setItem(TG_SENT_KEY, JSON.stringify(s)); }catch(e){}
}
function alreadySent(sentKey){
  return !!getSentDates()[sentKey];
}
function clearSent(sentKey){

  delete s[sentKey];
  try{ localStorage.setItem(TG_SENT_KEY, JSON.stringify(s)); }catch(e){}
}

function queueTelegramMessages(texts, sentKey, chatIds){
  const q = getTgQueue();
  q.push({ texts, sentKey, chatIds, ts: Date.now() });
  if(q.length > 100) q.splice(0, q.length - 100);
  setTgQueue(q);
}

async function sendToTelegram(chatId, text){
  const url = 'https://api.telegram.org/bot' + TELEGRAM_TOKEN + '/sendMessage';
  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: 'HTML' })
  });
  if (!response.ok) {
    const error = await response.text();
    throw new Error('Telegram API error: ' + response.status + ' - ' + error);
  }
  return response.json();
}

let tgFlushing = false;
async function flushTelegramQueue(){
  if(tgFlushing) return;
  tgFlushing = true;
  try{
    let q = getTgQueue();
    while(q.length){
      const item = q[0];
      try{
        // ===== ПЕРЕВІРКА НА ДАНІ =====
        const days = getDays();
        const day = days && days.length > 0 ? days[currentDay] : null;
        let hasAnyData = false;
        if (day && day.groups) {
          for(const g of day.groups){
            for(const it of g.items){
              const id = exId(day.id, it.name);
              const sets = pendingSets[id] || [];
              if(sets.some(s => s.raw && s.raw.trim() !== '')){
                hasAnyData = true;
                break;
              }
            }
            if(hasAnyData) break;
          }
        }
        
        if(!hasAnyData){
          console.log('⏭️ Пропускаємо відправку: немає даних');
          q.shift();
          setTgQueue(q);
          continue;
        }
        // ================================
        
        const textList = Array.isArray(item.texts) ? item.texts : [item.texts || item.text];
        const chatIds = item.chatIds || [CHAT_ID_MAIN];
        for(const t of textList){
          await sendToTelegram(chatIds[0], t);
        }
        if(item.sentKey) markSent(item.sentKey);
        q.shift();
        setTgQueue(q);
      }catch(e){
        console.warn('⏳ Черга тимчасово недоступна:', e.message);
        break;
      }
    }
  } finally { tgFlushing = false; }
}

async function sendWorkoutReport(force = false){
  const days = getDays();
  const day = days && days.length > 0 ? days[currentDay] : null;
  if (!day || !day.groups) {
    showToast('⚠️ Спочатку завантажте план тренувань');
    return false;
  }
  
  // Перевірка даних
  let hasAnyData = false;
  for(const g of day.groups){
    for(const it of g.items){
      const id = exId(day.id, it.name);
      const sets = pendingSets[id] || [];
      if(sets.some(s => s.raw && s.raw.trim() !== '')){
        hasAnyData = true;
        break;
      }
    }
    if(hasAnyData) break;
  }
  
  if(!hasAnyData){
    showToast('⚠️ Немає даних для відправки');
    return false;
  }
  
  const today = new Date().toISOString().slice(0,10);
  const sentKey = 'man::' + day.id + '::' + today;
  if(!force && alreadySent(sentKey)){
    showToast('Звіт за сьогодні вже відправлено');
    return false;
  }
  if(force) clearSent(sentKey);
  
  let num = 1;
  const numberedLines = [];
  const allSets = {};
  for(const g of day.groups){
    for(const it of g.items){
      const id = exId(day.id, it.name);
      const sets = setsFromPending(id);
      if(sets.length){
        try{
          await logExercise(id, {date: today, sets});
          savedThisSession[id] = true;
          const setsTxt = sets.map(s=>s.w + '/' + s.r).join(' | ');
          const altText = (pendingSets[id+'::alt'] || {}).raw || '';
          const nameLine = altText || it.name;
          numberedLines.push(num + '. ' + nameLine + '\n   ' + setsTxt);
          num++;
          allSets[nameLine] = sets;
        }catch(e){ console.error('storage error', e); }
      }
    }
  }
  
  if(num > 1){
    const text = buildWorkoutMessage(day, today, numberedLines);
    queueTelegramMessages([text], sentKey, [CHAT_ID_MAIN]);
    flushTelegramQueue();
    showToast(force ? '🔄 Звіт перевідправлено!' : '💪 Тренування збережено!');
    if(!force) renderMain();
    setTimeout(() => showRecoveryModal(), 500);
    return true;
  } else {
    showToast('Немає даних для збереження');
    return false;
  }
}

function buildWorkoutMessage(day, today, numberedLines){
  const ageText = userProfile.age ? '🎂 ' + userProfile.age + ' років' : '';
  const heightText = userProfile.height ? '📏 ' + userProfile.height + ' см' : '';
  const weightText = userProfile.weight ? '⚖️ ' + userProfile.weight + ' кг' : '';
  let msg = '👨 ' + ageText + ' ' + heightText + ' ' + weightText + ' — ' + day.label + '\n📅 ' + today + '\n';
  msg += '─'.repeat(30) + '\n';
  msg += numberedLines.join('\n');
  return msg;
}

async function logExercise(id, log){
  lastLogs[id] = log;
  localStorage.setItem('lastlog:'+id, JSON.stringify(log));
  let hist = [];
  const h = localStorage.getItem('history:'+id);
  if(h){
    try{ hist = JSON.parse(h); }catch(e){ hist = []; }
  }
  hist.push(log);
  if(hist.length>30) hist = hist.slice(-30);
  localStorage.setItem('history:'+id, JSON.stringify(hist));
}

function importAllData(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      let count = 0;
      for (const [key, value] of Object.entries(data)) {
        if (typeof value === 'string') {
          localStorage.setItem(key, value);
          count++;
        }
      }
      showToast('📥 Імпортовано ' + count + ' ключів! Перезавантажте сторінку.');
      document.querySelector('.debug-modal')?.remove();
      setTimeout(() => location.reload(), 1500);
    } catch(err) {
      showToast('❌ Помилка імпорту: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function clearAllData() {
  if (confirm('⚠️ ВИ ВПЕВНЕНІ? Це ВИДАЛИТЬ ВСІ дані!')) {
    if (confirm('🗑️ ОСТАННЄ ПОПЕРЕДЖЕННЯ: Видалити всі дані?')) {
      const keysToKeep = ['app_version'];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && !keysToKeep.includes(key)) {
          localStorage.removeItem(key);
        }
      }
      showToast('🗑️ Всі дані видалено! Перезавантажте сторінку.');
      document.querySelector('.debug-modal')?.remove();
      setTimeout(() => location.reload(), 1500);
    }
  }
}

      const ws = wb.Sheets['Чоловік'];
      if(!ws){ showToast('❌ Аркуш "Чоловік" не знайдено'); return; }
      
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      let headerRow = -1;
      for(let i=0; i<rows.length; i++){
        const row = rows[i];
        if(!row || row.length === 0) continue;
        if(String(row[0] || '').toLowerCase().includes('день')){ headerRow = i; break; }
      }
      if(headerRow === -1){ showToast('❌ Не знайдено заголовки'); return; }
      
      const groups = {1:{}, 2:{}, 3:{}};
      for(let r = headerRow + 1; r < rows.length; r++){
        const row = rows[r];
        if(!row || row.length === 0) continue;
        const day = parseInt(row[0]);
        if(![1,2,3].includes(day)) continue;
        const group = String(row[1] || '').trim();
        const name = String(row[2] || '').trim();
        const sets = parseInt(row[3]) || 3;
        const reps = String(row[4] || '10-12').trim();
        if(!name) continue;
        if(!groups[day][group]) groups[day][group] = [];
        groups[day][group].push({ name, sets, reps });
      }
      
      const result = [1,2,3].map(dayNum => ({
        id: 'd' + dayNum,
        label: 'День ' + dayNum,
        groups: Object.entries(groups[dayNum] || {}).map(([label, items]) => ({label, items}))
      }));
      
      if(!result.some(d => d.groups.length > 0)){
        showToast('❌ Немає даних в аркуші');
        return;
      }
      
      localStorage.setItem('custom-plan-man', JSON.stringify(result));
      DAYS_MAN = result;
      currentDay = 0;
      pendingSets = {};
      savedThisSession = {};
      checkedState = {};
      lastLogs = {};
      
      loadLastLogs().then(() => {
        renderAll();
        showToast('✅ План завантажено! ' + DAYS_MAN.length + ' днів');
      });
      
    }catch(err){
      console.error(err);
      showToast('❌ Помилка читання файлу: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

async function loadLastLogs(){
  const days = getDays();
  if (!days || days.length === 0) return;
  for(const day of days){
    if (!day || !day.groups) continue;
    for(const g of day.groups){
      for(const it of g.items){
        const id = exId(day.id, it.name);
        const raw = localStorage.getItem('lastlog:'+id);
        if(raw){
          try{
            const parsed = JSON.parse(raw);
            if (parsed && parsed.sets && Array.isArray(parsed.sets)) {
              lastLogs[id] = parsed;
            }
          }catch(e){}
        }
      }
    }
  }
}

function loadCustomPlans(){
  try {
    const man = localStorage.getItem('custom-plan-man');
    if(man){ const parsed = JSON.parse(man); if(parsed && parsed.length > 0) DAYS_MAN = parsed; }
  } catch(e) { console.error('Помилка завантаження плану:', e); }
}

  const savedAge = localStorage.getItem('user_age');
  const savedHeight = localStorage.getItem('user_height');
  const savedWeight = localStorage.getItem('user_weight');

  if (savedHeight) userProfile.height = parseInt(savedHeight);
  if (savedWeight) userProfile.weight = parseInt(savedWeight);
  if (savedHealth) userProfile.health = savedHealth;
  
  loadCustomPlans();
  loadAllData();

  if (!userProfile.age) {
    setTimeout(showProfileModal, 1000);
  }
})();
