<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренувальний план</title>
<style>
  :root{
    --bg: #0a0c15;
    --panel: #141824;
    --panel2: #1a2030;
    --line: #2a3050;
    --ink: #ffffff;
    --muted: #b8c4e0;
    --accent: #e8a33d;
    --accent2: #4a90d9;
    --green: #3cb371;
    --red: #d9534f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: #ffffff;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
  }
  header{
    padding: 18px 16px 10px; text-align:center; position:sticky; top:0; z-index:10;
    background: linear-gradient(180deg, #0a0c15 80%, transparent);
  }
  header h1{
    margin:0; font-size: 1.8rem; letter-spacing:.5px;
    font-family: Georgia, 'Times New Roman', serif;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(0,255,136,0.2), 0 0 60px rgba(0,255,136,0.05);
    font-weight: 700;
  }
  header h1 .emoji-btn {
    cursor: pointer;
    display: inline-block;
    transition: all 0.2s;
    user-select: none;
  }
  header h1 .emoji-btn:hover {
    transform: scale(1.3);
    text-shadow: 0 0 30px rgba(0,255,136,0.6);
  }
  header h1 .emoji-btn:active {
    transform: scale(0.85);
  }
  header .sub{ 
    color: #d8ddf0; 
    font-size: 1rem; 
    margin-top:6px;
    font-weight: 400;
  }

  .week-bar{
    display:flex; gap:6px; justify-content:center; flex-wrap:wrap;
    padding: 8px 12px 14px;
  }
  .week-bar button{
    background:var(--panel); border:1px solid var(--line); color: #d8ddf0;
    padding:8px 14px; border-radius:8px; font-size:.85rem; cursor:pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .week-bar button:hover{
    background: var(--panel2);
    border-color: var(--accent2);
    color: #ffffff;
  }
  .week-bar button.active{
    background: var(--accent); color:#1a1208; border-color:var(--accent); font-weight:700;
  }

  nav.days{
    display:flex; gap:8px; padding: 0 12px 12px; justify-content:center;
  }
  nav.days button{
    flex:1; max-width:160px; background:var(--panel2); border:1px solid var(--line);
    color:#d8ddf0; padding:12px 8px; border-radius:10px; font-size:.9rem; cursor:pointer;
    font-weight:600;
    transition: all 0.2s;
  }
  nav.days button:hover{
    background: var(--panel);
    border-color: var(--accent);
    color: #ffffff;
  }
  nav.days button.active{
    background: linear-gradient(135deg,#2a3a5c,#1d2130); border-color: var(--accent2);
    box-shadow: 0 0 0 2px var(--accent2) inset;
    color: #ffffff;
  }
  nav.days button.last-workout {
    border-color: var(--green) !important;
    box-shadow: 0 0 20px rgba(60, 179, 113, 0.3) !important;
    position: relative;
  }
  nav.days button.last-workout::after {
    content: '✅';
    position: absolute;
    top: -6px;
    right: -6px;
    font-size: 0.7rem;
    background: var(--bg);
    border-radius: 50%;
    padding: 2px;
  }

  main{ max-width: 720px; margin: 0 auto; padding: 0 12px 16px; }

  .group-label{
    margin: 28px 0 14px;
    padding: 8px 0;
    text-align: center;
  }
  .group-label .group-name {
    display: inline-block;
    padding: 6px 24px;
    border-radius: 12px;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #00ff88;
    text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88, 0 0 40px rgba(0,255,136,0.3), 0 0 80px rgba(0,255,136,0.1);
    background: rgba(0,255,136,0.06);
    border: 1px solid rgba(0,255,136,0.15);
  }

  .user-profile {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .user-profile .label {
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .user-profile .value {
    color: #ffffff;
    font-weight: 700;
    font-size: 0.95rem;
  }
  .user-profile .edit-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 12px;
    cursor: pointer;
    font-size: 0.75rem;
    transition: all 0.2s;
    margin-left: auto;
  }
  .user-profile .edit-btn:hover {
    border-color: var(--accent2);
    color: #ffffff;
  }

  .card{
    background: var(--panel); border:1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .card.done{ opacity:.5; }
  .card-top{ display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  
  .ex-name{ 
    font-weight:700; 
    font-size:1.05rem; 
    color: #ffffff; 
    margin-bottom: 2px;
  }
  .ex-meta{ 
    color: #b8c4e0; 
    font-size:.85rem; 
    margin-top:2px;
    font-weight: 400;
  }
  .ex-note{
    color: var(--accent2);
    font-size:.75rem;
    margin-top:2px;
    font-style: italic;
  }
  
  .ai-tip {
    font-size: 0.7rem;
    color: var(--accent);
    margin-top: 3px;
    opacity: 0.8;
    display: flex;
    align-items: center;
    gap: 4px;
    font-weight: 400;
  }
  
  .ex-status {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-right: 6px;
  }
  .ex-status.done {
    background: var(--green);
    box-shadow: 0 0 12px rgba(60, 179, 113, 0.5);
  }
  .ex-status.partial {
    background: var(--accent);
    box-shadow: 0 0 12px rgba(232, 163, 61, 0.5);
  }
  .ex-status.empty {
    background: var(--line);
  }

  .day-progress {
    background: var(--panel2);
    border-radius: 10px;
    padding: 8px 14px;
    margin: 10px 0 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--line);
  }
  .day-progress .bar {
    flex: 1;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .day-progress .bar .fill {
    height: 100%;
    background: var(--green);
    border-radius: 3px;
    transition: width 0.3s;
    width: 0%;
  }
  .day-progress .text {
    font-size: 0.8rem;
    color: var(--muted);
    white-space: nowrap;
    font-weight: 500;
  }
  .day-progress .text b {
    color: var(--ink);
  }

  .week-progress-line{
    color: #7ab8ff; 
    font-size:.75rem; 
    margin-top:6px; 
    line-height:1.6;
    word-spacing: 3px;
    background: rgba(74, 144, 217, 0.08);
    padding: 4px 8px;
    border-radius: 6px;
  }
  .cur-week{ 
    color: var(--accent); 
    font-weight: 700;
    font-size: .85rem;
    background: rgba(232,163,61,0.2);
    padding: 1px 6px;
    border-radius: 4px;
  }

  .actions{ margin-left:auto; display:flex; gap:8px; flex:0 0 auto; }
  .icon-btn{
    background:var(--panel2); border:1px solid var(--line); color:#d8ddf0;
    border-radius:8px; padding:8px 12px; font-size:.85rem; cursor:pointer; text-decoration:none;
    white-space:nowrap;
    transition: all 0.2s;
    font-weight: 500;
  }
  .icon-btn:hover{ 
    border-color:var(--accent2); 
    color: #ffffff;
    background: var(--panel);
    transform: scale(1.05);
  }

  .sets-row{ 
    display:grid; 
    grid-template-columns: repeat(6, 1fr);
    gap:6px; 
    margin-top:12px; 
  }
  .set-input{
    display:flex; flex-direction:column; gap:3px;
    position:relative;
  }
  .set-input .set-status {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin: 0 auto 2px;
    transition: all 0.3s;
  }
  .set-input .set-status.filled {
    background: var(--green);
    box-shadow: 0 0 8px rgba(60, 179, 113, 0.4);
  }
  .set-input .set-status.empty {
    background: var(--line);
  }
  .set-input label{ 
    font-size:.6rem; 
    color: #b8c4e0;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-align:center;
  }
  .set-input input{
    width:100%; background: #0d0f1a; border:1px solid var(--line); color: #ffffff;
    border-radius:6px; padding:6px 4px; font-size:.8rem; text-align:center;
    transition: all 0.2s;
    font-weight: 500;
  }
  .set-input input:focus{ 
    outline:none; 
    border-color:var(--accent2);
    box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.25);
    background: #131625;
  }
  .set-input input::placeholder{
    color: #6a7290;
    font-weight: 400;
    font-size: 0.6rem;
  }

  .last-log{
    margin-top:10px; font-size:.85rem; color: #d8ddf0;
    background: #0d0f1a; border-radius:8px; padding:8px 12px; border:1px solid var(--line);
  }
  .last-log b{ color: var(--green); font-weight: 700; }

  .alt-wrapper {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  .alt-wrapper .alt-select {
    flex: 1;
    margin-top: 0;
    min-width: 120px;
  }
  .alt-wrapper .icon-btn {
    padding: 4px 8px;
    font-size: 0.8rem;
    flex-shrink: 0;
  }
  .clear-alt-btn {
    background: var(--panel2);
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
    font-size: 0.8rem;
    flex-shrink: 0;
    transition: all 0.2s;
    line-height: 1.4;
    font-weight: bold;
  }
  .clear-alt-btn:hover {
    background: var(--red);
    color: #ffffff;
    border-color: var(--red);
  }

  .alt-select{
    width:100%; background: #0d0f1a; border:1px solid var(--line);
    color: #b8c4e0; border-radius:6px;
    font-size:.85rem; padding:6px 10px;
    cursor:pointer; outline:none;
    -webkit-appearance:none; appearance:none;
    transition: all 0.2s;
  }
  .alt-select:focus{ 
    border-color:var(--accent); 
    color:#ffffff;
    box-shadow: 0 0 0 2px rgba(232,163,61,0.15);
  }
  .alt-select option{ 
    background:var(--panel); 
    color:#ffffff;
    padding: 4px;
  }
  .alt-select optgroup{
    background:var(--panel);
    color: var(--accent);
    font-weight: 700;
    font-size: .85rem;
    padding: 4px 0;
  }
  .alt-select optgroup option{
    padding-left: 12px;
    font-weight: 400;
    color: #d8ddf0;
  }

  .note-box{
    background: rgba(232,163,61,.1); border:1px solid rgba(232,163,61,.25);
    border-radius:10px; padding:12px 16px; font-size:.85rem; color: #e8d5a8; margin: 16px 0;
    line-height: 1.6;
  }

  .bottom-bar {
    max-width: 720px;
    margin: 0 auto;
    padding: 8px 12px 16px;
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    border-top: 1px solid var(--line);
    margin-top: 8px;
  }
  .bottom-btn {
    background: var(--panel2);
    border: 1px solid var(--line);
    color: #6a7290;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    font-family: inherit;
    line-height: 1.2;
    flex: 0 1 auto;
    min-width: 48px;
    justify-content: center;
  }
  .bottom-btn:hover {
    border-color: var(--accent2);
    color: #ffffff;
    background: var(--panel);
    transform: scale(1.05);
  }
  .bottom-btn:active {
    transform: scale(0.9);
  }
  .bottom-btn .label {
    font-size: 0.5rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.2px;
    text-transform: uppercase;
  }
  .bottom-btn:hover .label {
    color: #ffffff;
  }
  .bottom-btn.save-btn {
    border-color: rgba(232,163,61,0.3);
    color: var(--accent);
  }
  .bottom-btn.save-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .bottom-btn.resend-btn {
    border-color: rgba(74,144,217,0.3);
    color: var(--accent2);
  }
  .bottom-btn.resend-btn:hover {
    border-color: var(--accent2);
    color: var(--accent2);
  }
  .bottom-btn.import-btn {
    border-color: rgba(60,179,113,0.3);
    color: var(--green);
  }
  .bottom-btn.import-btn:hover {
    border-color: var(--green);
    color: var(--green);
  }
  .bottom-btn.debug-btn {
    border-color: rgba(232,163,61,0.2);
    color: #7ab8ff;
  }
  .bottom-btn.debug-btn:hover {
    border-color: #7ab8ff;
    color: #7ab8ff;
  }

  .toast{
    position: fixed; bottom: 80px; left:50%; transform:translateX(-50%);
    background: var(--green); color:#0a0c15; padding:12px 24px; border-radius:12px;
    font-size:1rem; font-weight:700; opacity:0; transition:opacity .3s; pointer-events:none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    z-index: 200;
  }
  .toast.show{ opacity:1; }

  .debug-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .debug-modal .content {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    max-width: 650px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .debug-modal .content h2 {
    color: var(--accent);
    margin-top: 0;
    font-size: 1.1rem;
    text-align: center;
  }
  .debug-modal .content .info-text {
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
    margin-bottom: 12px;
  }
  .debug-modal .content .key-item {
    background: var(--bg);
    border-radius: 6px;
    padding: 6px 10px;
    margin-bottom: 4px;
    font-size: 0.7rem;
    font-family: monospace;
    word-break: break-all;
    border-left: 2px solid var(--accent2);
  }
  .debug-modal .content .key-item .key {
    color: var(--accent2);
    font-weight: 600;
  }
  .debug-modal .content .key-item .value {
    color: var(--muted);
  }
  .debug-modal .content .btn-group {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .debug-modal .content .btn-group button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    min-width: 80px;
    max-width: 200px;
    transition: all 0.2s;
  }
  .debug-modal .content .btn-group button:hover {
    transform: scale(1.03);
  }
  .debug-modal .content .btn-group .close-debug {
    background: var(--accent2);
    color: #fff;
  }
  .debug-modal .content .btn-group .export-btn {
    background: var(--accent);
    color: #1a1208;
  }
  .debug-modal .content .btn-group .import-btn {
    background: var(--green);
    color: #fff;
  }
  .debug-modal .content .btn-group .clear-btn {
    background: var(--red);
    color: #fff;
  }
  .debug-modal .content .file-input-wrap {
    display: none;
  }

  .recovery-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .recovery-modal .content {
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 20px;
    padding: 24px 28px;
    max-width: 480px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .recovery-modal .content h2 {
    text-align: center;
    color: var(--accent);
    margin-top: 0;
    font-size: 1.4rem;
  }
  .recovery-modal .content .emoji-big {
    font-size: 3rem;
    text-align: center;
    display: block;
  }
  .recovery-modal .content ul {
    list-style: none;
    padding: 0;
    margin: 16px 0;
  }
  .recovery-modal .content ul li {
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95rem;
  }
  .recovery-modal .content ul li:last-child {
    border-bottom: none;
  }
  .recovery-modal .content .close-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #1a1208;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 12px;
    transition: all 0.2s;
  }
  .recovery-modal .content .close-btn:hover {
    transform: scale(1.02);
  }

  .icon-btn.save-ex{ color: var(--accent); border-color: rgba(232,163,61,.3); }
  .icon-btn.save-ex:hover{ 
    border-color: var(--accent);
    color: var(--accent);
  }
  .icon-btn.save-ex.saved{ color: var(--green); border-color: rgba(60,179,113,.3); }
  .icon-btn.cal-btn{ color: var(--accent2); }
  .icon-btn.cal-btn:hover{ color: #7ab8ff; }

  .modal-overlay{
    position: fixed; inset:0; background: rgba(0,0,0,.8); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    background: var(--panel); border:1px solid var(--line); border-radius: 16px 16px 0 0;
    width:100%; max-width: 720px; max-height: 78vh; overflow-y:auto; padding: 20px 20px 28px;
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-head h3{ 
    margin:0; 
    font-size:1.1rem; 
    color: #ffffff;
    font-weight: 700;
  }
  .modal-close{
    background:var(--panel2); border:1px solid var(--line); color:#d8ddf0;
    border-radius:8px; width:36px; height:36px; cursor:pointer; font-size:1.2rem;
    transition: all 0.2s;
    font-weight: bold;
  }
  .modal-close:hover{
    border-color: var(--red);
    color: #ffffff;
    background: rgba(217, 83, 79, 0.1);
  }
  .hist-row{
    display:flex; justify-content:space-between; gap:12px; padding:10px 14px;
    background: #0d0f1a; border-radius:8px; margin-bottom:8px; font-size:.9rem;
  }
  .hist-row .hd{ color: #b8c4e0; flex:0 0 auto; font-weight: 500; }
  .hist-row .hv{ color: #ffffff; text-align:right; font-weight: 600; }
  .hist-empty{ color:#b8c4e0; font-size:.9rem; text-align:center; padding: 24px 0; }

  .profile-bar{
    display:flex; gap:10px; justify-content:center; padding: 6px 12px 12px;
  }
  .profile-bar button{
    background:var(--panel2); border:1px solid var(--line); color:#b8c4e0;
    padding:10px 22px; border-radius:10px; font-size:.9rem; cursor:pointer; font-weight:600;
    transition: all 0.2s;
  }
  .profile-bar button:hover{
    border-color: var(--accent);
    color: #ffffff;
    background: var(--panel);
  }
  .profile-bar button.active{
    background: linear-gradient(135deg,#3a2a1a,#1d2130); border-color: var(--accent);
    color: #ffffff; box-shadow: 0 0 0 2px var(--accent) inset;
  }

  .age-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .age-modal .content {
    background: var(--panel);
    border: 1px solid var(--accent2);
    border-radius: 20px;
    padding: 28px 32px;
    max-width: 450px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .age-modal .content h2 {
    text-align: center;
    color: var(--accent2);
    margin-top: 0;
    font-size: 1.3rem;
  }
  .age-modal .content p {
    color: var(--muted);
    text-align: center;
    font-size: 0.9rem;
    margin-bottom: 16px;
  }
  .age-modal .content .form-group {
    margin-bottom: 12px;
  }

(function() {
  const today = new Date().toISOString().slice(0,10);
  let version = localStorage.getItem('app_version');
  let versionDate = version ? version.split('-')[0] : '';
  
  if (!version || versionDate !== today) {
    version = today + '-' + Math.random().toString(36).substr(2, 6);
    localStorage.setItem('app_version', version);
  }
  
  document.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
    if (link.href && !link.href.includes('v=')) {
      link.href += (link.href.includes('?') ? '&' : '?') + 'v=' + version;
    }
  });
  
  document.querySelectorAll('script[src]').forEach(script => {
    if (script.src && !script.src.includes('v=') && !script.src.includes('xlsx')) {
      script.src += (script.src.includes('?') ? '&' : '?') + 'v=' + version;
    }
  });
  
  const manifest = document.querySelector('link[rel="manifest"]');
  if (manifest && manifest.href && !manifest.href.includes('v=')) {
    manifest.href += (manifest.href.includes('?') ? '&' : '?') + 'v=' + version;
  }
})();
